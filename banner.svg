<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <title>Anup Kumar Shaw · Software Engineer · AI-Native Development</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badge" x1="0" x2="1">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="term"><rect x="620" y="26" width="540" height="250" rx="12"/></clipPath>
    <clipPath id="card"><rect width="1200" height="300" rx="16"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 14px; }
    .glow1 { animation: drift1 14s ease-in-out infinite alternate; }
    .glow2 { animation: drift2 18s ease-in-out infinite alternate; }
    @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(-120px,40px); } }
    @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(140px,-30px); } }

    .content { animation: fadeall 12s linear infinite; }
    @keyframes fadeall { 0%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }

    .cover { animation: type 12s infinite; }
    @keyframes type {
      0% { transform: translateX(0); animation-timing-function: steps(49, end); }
      20%, 100% { transform: translateX(440px); }
    }

    .l1, .l2, .l3, .l4, .l5, .l6 { opacity: 0; }
    .l1 { animation: s1 12s infinite; } @keyframes s1 { 0%, 23% { opacity: 0; } 25%, 100% { opacity: 1; } }
    .l2 { animation: s2 12s infinite; } @keyframes s2 { 0%, 29% { opacity: 0; } 31%, 100% { opacity: 1; } }
    .l3 { animation: s3 12s infinite; } @keyframes s3 { 0%, 35% { opacity: 0; } 37%, 100% { opacity: 1; } }
    .l4 { animation: s4 12s infinite; } @keyframes s4 { 0%, 41% { opacity: 0; } 43%, 100% { opacity: 1; } }
    .l5 { animation: s5 12s infinite; } @keyframes s5 { 0%, 47% { opacity: 0; } 49%, 100% { opacity: 1; } }
    .l6 { animation: s6 12s infinite; } @keyframes s6 { 0%, 53% { opacity: 0; } 55%, 100% { opacity: 1; } }

    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#0b1220"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle class="glow1" cx="1050" cy="20" r="330" fill="url(#g1)"/>
    <circle class="glow2" cx="250" cy="330" r="300" fill="url(#g2)"/>

    <!-- Left: identity -->
    <g class="sans">
      <text x="60" y="88" font-size="14" font-weight="600" letter-spacing="3" fill="#5eead4">SOFTWARE ENGINEER · AI-NATIVE DEVELOPMENT</text>
      <text x="58" y="146" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Anup Kumar Shaw</text>
      <text x="60" y="184" font-size="19" fill="#b6c2d6">I take products from <tspan fill="#5eead4" font-weight="600">spec to launch</tspan>.</text>
      <text x="60" y="227" font-size="15" fill="#cbd5e1"><tspan font-weight="600" fill="#fff">TypeScript</tspan> · <tspan font-weight="600" fill="#fff">NestJS</tspan> · <tspan font-weight="600" fill="#fff">Next.js</tspan> · <tspan font-weight="600" fill="#fff">PostgreSQL</tspan> · <tspan font-weight="600" fill="#fff">GCP</tspan></text>
      <rect x="60" y="243" width="212" height="30" rx="15" fill="url(#badge)" stroke="#a5b4fc" stroke-opacity="0.5"/>
      <text x="166" y="263" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">4x Google Cloud Certified</text>
    </g>

    <!-- Right: terminal -->
    <rect x="620" y="26" width="540" height="250" rx="12" fill="#0f172a"/>
    <g clip-path="url(#term)">
      <rect x="620" y="26" width="540" height="32" fill="#111c33"/>
      <circle cx="642" cy="42" r="6" fill="#ff5f57"/>
      <circle cx="662" cy="42" r="6" fill="#febc2e"/>
      <circle cx="682" cy="42" r="6" fill="#28c840"/>
      <text class="mono" x="890" y="47" font-size="12" fill="#64748b" text-anchor="middle">anup@anocloud: ~/products</text>

      <g class="mono content">
        <text x="642" y="90"><tspan fill="#5eead4">$</tspan><tspan fill="#e2e8f0"> ship --from spec --to launch --agents multi-model</tspan></text>
        <rect class="cover" x="656" y="74" width="440" height="24" fill="#0f172a"/>

        <text class="l1" x="642" y="122"><tspan fill="#4ade80">✓</tspan><tspan fill="#94a3b8"> spec</tspan><tspan x="772" fill="#e2e8f0">PRD → interactive prototype</tspan></text>
        <text class="l2" x="642" y="146"><tspan fill="#4ade80">✓</tspan><tspan fill="#94a3b8"> design</tspan><tspan x="772" fill="#e2e8f0">architecture + security review</tspan></text>
        <text class="l3" x="642" y="170"><tspan fill="#4ade80">✓</tspan><tspan fill="#94a3b8"> plan</tspan><tspan x="772" fill="#e2e8f0">phased, small testable tasks</tspan></text>
        <text class="l4" x="642" y="194"><tspan fill="#4ade80">✓</tspan><tspan fill="#94a3b8"> build</tspan><tspan x="772" fill="#e2e8f0">3 engineers + AI agents</tspan></text>
        <text class="l5" x="642" y="218"><tspan fill="#4ade80">✓</tspan><tspan fill="#94a3b8"> test</tspan><tspan x="772" fill="#e2e8f0">1,400+ automated tests</tspan></text>
        <text class="l6" x="642" y="248"><tspan fill="#5eead4" font-weight="700">→ launched</tspan><tspan x="772" fill="#e2e8f0">HR · sales · retail · healthcare · finance </tspan><tspan class="cursor" fill="#5eead4">&#9608;</tspan></text>
      </g>
    </g>
    <rect x="620" y="26" width="540" height="250" rx="12" fill="none" stroke="#94a3b8" stroke-opacity="0.28"/>
  </g>
</svg>
